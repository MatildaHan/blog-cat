{{ define "main" }}
<div id="content" class="site-layout">
    {{ partial "sidebar.html" . }}
    <main class="site-main">
        <section class="feed-panel moments-panel" aria-labelledby="moments-heading">
            <div class="feed-heading">
                <h2 id="moments-heading">{{ .Title }}</h2>
                <a href="{{ .Site.Home.RelPermalink }}">← {{ partial "text.html" "back_home" }}</a>
            </div>
            {{ partial "moment-list.html" .RegularPages.ByDate.Reverse }}
        </section>
    </main>
</div>
{{ end }}
