{{ if gt .TotalPages 1 }}
<nav class="feed-pagination" aria-label="{{ i18n "pagination" }}">
    {{ with .Prev }}<a href="{{ .URL }}" rel="prev">{{ i18n "previous_page" }}</a>{{ else }}<span aria-disabled="true">{{ i18n "previous_page" }}</span>{{ end }}
    <span class="page-count" aria-current="page">{{ .PageNumber }} / {{ .TotalPages }}</span>
    {{ with .Next }}<a href="{{ .URL }}" rel="next">{{ i18n "next_page" }}</a>{{ else }}<span aria-disabled="true">{{ i18n "next_page" }}</span>{{ end }}
</nav>
{{ end }}
