{{ if hugo.IsMultilingual }}
<nav class="languages" aria-label="{{ i18n "language_switch" }}">
    <ul>
    {{ range .Site.Home.AllTranslations }}
        {{ $language := .Language.Lang }}
        {{ $target := . }}
        {{ range $.AllTranslations }}
            {{ if eq .Language.Lang $language }}{{ $target = . }}{{ end }}
        {{ end }}
        <li><a href="{{ $target.RelPermalink }}" lang="{{ .Language.LanguageCode }}" hreflang="{{ .Language.LanguageCode }}"{{ if eq $.Site.Language.Lang $language }} aria-current="page"{{ end }}>{{ .Language.LanguageName }}</a></li>
    {{ end }}
    </ul>
</nav>
{{ end }}
