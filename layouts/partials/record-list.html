<div class="record-list">
    {{ range . }}
    <div class="record{{ if .Params.cover }} has-thumbnail{{ end }}">
        <div class="record-body">
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            <div class="record-meta">{{ with .Params.author }}@{{ . }} · {{ end }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006/01/02" }}</time></div>
            <div class="record-summary">{{ .Summary | plainify | truncate 100 }}</div>
        </div>
        {{ $coverAlt := or .Params.cover_alt .Title }}
        {{ with .Params.cover }}
        <img class="record-thumbnail" src="{{ . }}" alt="{{ $coverAlt }}" loading="lazy" width="83" height="102">
        {{ end }}
    </div>
    {{ else }}
    <p class="feed-empty">{{ partial "text.html" "no_records" }}</p>
    {{ end }}
</div>
