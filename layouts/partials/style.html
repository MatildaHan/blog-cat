<style>
{{ $theme := .Site.Data.custom_themes }}

:root {
    --site-bg: url("{{ index $theme "site-bg" }}");
    --accent-color: {{ index $theme "accent-color" }};
    --select-color: {{ index $theme "select-color" }};
    --link-color: {{ index $theme "link-color" }};
    --bg-color: {{ index $theme "bg-color" }};
    --text-color: {{ index $theme "text-color" }};
    --bg-color2: {{ index $theme "bg2-color" }};
    --border-color: {{ index $theme "border-color" }};
    --special-text-color: {{ index $theme "special-text-color" }};
    --post-header-color: {{ index $theme "post-header-color" }};
    --post-shadow-color: {{ index $theme "post-shadow-color" }};
    --outline-color: {{ index $theme "post-outline-color" }};
    --outline-color2: {{ index $theme "post-outline-color2" }};
    --list-style-image: url("{{ (index $theme "list-style").image }}");
}

* {
    box-sizing: border-box;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}

@-moz-document url-prefix() {
    * {
        scrollbar-width: thin;
        scrollbar-color: var(--accent-color) #00000000;
    }
}

::-webkit-scrollbar {
    height: 8px;
    width: 8px;
    background: #00000000;
}

::-webkit-scrollbar-thumb {
    background: var(--accent-color);
    -webkit-border-radius: .3rem;
    -webkit-box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.75);
}

::-webkit-scrollbar-corner {
    background: #000;
}

::selection {
    background: var(--select-color);
    color: var(--border-color);
}

body {
    background-color: var(--bg-color);
    background-image: var(--site-bg);
    margin: 0;
    font-size: 14px;
    color: var(--text-color);
}

p {line-height: 1.5em;}

h1 {
    font-size: 1.5em;
    color: var(--post-header-color);
    filter: drop-shadow(2px 0 0 var(--outline-color)) drop-shadow(0 2px 0 var(--outline-color)) drop-shadow(-2px 0 0 var(--outline-color)) drop-shadow(0 -2px 0 var(--outline-color))drop-shadow(0 1px 1px var(--outline-color2)) drop-shadow(1px 0 1px var(--outline-color2));
}

h4,
h5,
h6 {color: var(--special-text-color);}

header {
    position: relative;
    padding: 3.5rem 1rem 1rem;
    background-size: 100%;
    background-position: center;
    min-height: 80px;
    margin: 0 0;
    align-content: center;
}

header > h1 {
    background-color: var(--bg-color2);
    color: var(--special-text-color);
    margin: 0 auto;
    font-size: 2em;
    max-width: 48rem;
    padding: 6px 12px;
    border-radius: 1em;
    border: 4px double var(--outline-color);
    filter: none;
    text-align: center;
}

li {
    list-style-image: var(--list-style-image);
}

nav {margin: 1em;}

nav.links > ul {
    max-width: 960px;
    margin: auto;
    line-height: 3rem;
    list-style-type: none;
    padding-left: 0;
    justify-content: space-evenly;
}

nav.links li {
    text-align: center;
    list-style-image: none;
    list-style-type: none;
}

nav.links li > a,
nav.links li > button {
    font-weight: bold;
    background-color: var(--bg-color);
    border: 4px double var(--outline-color);
    padding: .5em 3em;
    text-decoration: none;
}

nav.links li > button {
    font-family: inherit;
    font-size: inherit;
    line-height: normal;
    color: var(--link-color);
    border-radius: .3em;
    cursor: default;
}

nav.links li > a:visited {color: var(--link-color);}
nav.links li > a:hover {
    color: var(--accent-color);
    background-color: var(--select-color);
}

nav.languages {
    position: absolute;
    top: .75rem;
    right: 1rem;
    margin: 0;
}

nav.languages ul {
    display: flex;
    gap: .15rem;
    margin: 0;
    padding: .15rem;
    border: 2px solid var(--outline-color);
    border-radius: .6rem;
    background-color: var(--bg-color2);
}

nav.languages li {
    list-style: none;
}

nav.languages a {
    display: block;
    min-width: 2.25rem;
    padding: .35rem .65rem;
    border-radius: .35rem;
    color: var(--link-color);
    font-weight: bold;
    text-align: center;
    text-decoration: none;
}

nav.languages a:hover {
    background-color: var(--select-color);
}

nav.languages a:focus-visible {
    outline: 2px solid var(--accent-color);
    outline-offset: -2px;
}

nav.languages a[aria-current="page"] {
    background-color: var(--bg-color);
    color: var(--special-text-color);
}

a {
    color: var(--link-color);
    border-radius: .3em;
    transition: .2s ease-out;
}

a:visited {
    color: var(--text-color);
}

a:hover {
    color: var(--accent-color);
    border-color: var(--accent-color);
    transition: .2s ease;
}

#sidebar {
    background-color: var(--bg-color2);
    color: var(--special-text-color);
    height: fit-content;
    min-width: 320px;
    margin-top: 1em;
    margin-right: 2em;
    border-radius: .5em;
}

.small-box {
    max-width: 240px;
    margin: auto;
    border: 2px solid var(--bg-color);
    font-size: 11px;
    line-height: 1.5rem;
}

#avatar {
    margin: .5em;
    max-width: 320px;
}

.flower {
    width: 300px;
    aspect-ratio: 1;
    border-radius: 50%;
}

#bio {
    position: relative;
    margin: 20px;
    padding: .2em;
    background: var(--bg-color);
    border: 4px double var(--bg-color2);
    border-radius: 2em;
    font-size: small;
}

#bio::before {
    content: "";
    position: absolute;
    top: -12px;
    left: 28px;
    width: 20px;
    height: 20px;
    background: var(--bg-color);
    border-top: 4px double var(--bg-color2);
    border-left: 4px double var(--bg-color2);
    border-top-left-radius: 6px;
    transform: rotate(45deg);
    pointer-events: none;
}

#bio p { margin: 1em; }

#content {
    display: flex;
    max-width: 960px;
    margin: auto;
}

#content > main {
    min-width: 0;
}

main {
    padding: 1em;
    padding-top: 0;
}

article img { max-width: 100%; }

header h1 a {
    cursor: pointer;
    text-decoration: none;
    color: var(--special-text-color);
}

header h1 a:visited {
    color: inherit;
}

header h1 a:hover {
    color: inherit;
}

@media (max-width: 800px) {
    header { min-height: 110px; }
    header > h1 { padding: .3em 1em; }
    #sidebar nav.links ul {
        display: flex;
        flex-wrap: wrap;
        gap: 1em;
        line-height: 2em;
    }
}

pre {
    border:1px solid var(--outline-color);
    border-radius:6px;
    padding:0.75rem 1rem;
    margin:1.2rem 0;
    overflow-x:auto;
}
</style>
