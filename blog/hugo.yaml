baseURL: 'https://blog-cat-5da.pages.dev/'
languageCode: 'zh-cn'
defaultContentLanguage: zh
theme: "neopost"
disableKinds: [taxonomy, term]

permalinks:
  posts: "/posts/:contentbasename/"

params:
  favicon: "/favicon.png?v=b967765b0ea8"
  posts-per-page: 2
  moments-per-page: 2
  toc-auto-numbering: false
  tiantian: true

# Read each bilingual source once per language; publish only the selected block.
module:
  mounts:
    - source: content
      target: assets/bilingual
    - source: assets
      target: assets
    - source: adapters
      target: content
